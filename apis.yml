aid: voodoo
name: Voodoo
description: 'Voodoo is a Paris-based mobile games and apps company founded in 2013 by Alexandre
  Yazdi and Laurent Ritter. It develops and publishes free-to-play mobile titles (Paper.io, Hole.io,
  Helix Jump, Mob Control), operates a partner publishing programme used by thousands of external
  studios, runs an in-house mobile ad network (Voodoo ADN) and an advertising business selling
  interstitial, rewarded and in-game inventory across roughly 150 million monthly active users, and
  owns the social apps BeReal and Wizz. Its developer-facing surface is a partner platform rather than
  a public API: the Publishing Platform (Publidash) dashboard, its auth-gated backend at
  v2-publidash-api.voodoo.io, and first-party mobile ad SDKs distributed through CocoaPods, Swift
  Package Manager and a Voodoo-hosted Maven repository.'
