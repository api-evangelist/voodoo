apis:
- aid: voodoo-publishing-platform
  name: Voodoo Publishing Platform API
  description: 'The HTTP backend behind Voodoo''s Publishing Platform (Publidash), the dashboard
    partner studios use to submit prototypes, run tests, and read analytics, monetization and IAP
    figures. The host is named directly in the public JavaScript bundle the platform serves. Every
    route probed anonymously answers with a JSON envelope and HTTP 401
    ("error.generic.forbiddenAccess" / "error.basicPublidash.forbiddenAccess"); Voodoo publishes no
    OpenAPI, Swagger, GraphQL or reference documentation for it, and access is limited to signed-in
    partner studios.'
  humanURL: https://voodoo.io/publishing
  baseURL: https://v2-publidash-api.voodoo.io
  image: https://framerusercontent.com/images/cKiSnoz2B6fJXIxssj9GA1gg.jpg
