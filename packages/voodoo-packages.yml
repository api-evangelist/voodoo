method: searched
source: >-
  GitHub orgs github.com/VoodooTeam and github.com/VoodooADN, the CocoaPods podspecs and Swift
  Package Manager tags Voodoo publishes there, the Maven repository named in the
  APPS-ad-tools-android README, and the npm registry search API for the @voodoo.io scope.
notes:
  - >-
    Voodoo publishes no REST/HTTP client SDKs, because it publishes no public HTTP API. The
    first-party libraries below are MOBILE AD SDKs (Voodoo ADN for iOS, io.voodoo.apps ad tools for
    Android) plus a small set of open-source Node.js infrastructure utilities under the @voodoo.io
    npm scope. Ownership is not inferred from the repo name: the VoodooAdn podspec declares
    author "Voodoo.io", homepage https://www.voodoo.io and binaries hosted on
    framework.voodoo-adn.com.
  - >-
    Voodoo does not publish these to the public CocoaPods trunk or to Maven Central. The iOS SDK is
    distributed from Voodoo-operated podspec/SPM repositories on GitHub, and the Android artifacts
    from a Voodoo-operated S3-backed Maven repository at apps-sdk.voodoo-tech.io, which returns
    HTTP 403 to anonymous listing and metadata requests. Where no anonymous registry metadata
    endpoint answers, version is recorded null with the reason.
